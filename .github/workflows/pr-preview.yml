# Builds the Jekyll site for the current branch and deploys it to a temporary
# GitHub Pages preview URL so changes can be reviewed before merging.
#
# Prerequisites:
#   - GitHub Pages must be enabled and configured to deploy from the gh-pages
#     branch (Settings > Pages > Build and deployment > Source > Deploy from
#     a branch, then select the gh-pages branch and / (root) folder).
#
# The preview URL is posted as a comment on the PR and updated on each new commit.
# The preview is automatically removed when the PR is closed.

name: Deploy PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# Cancel any in-progress preview deployment when a new commit is pushed to the PR.
concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Jekyll
        if: github.event.action != 'closed'
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # Remove the CNAME file from the build output so the preview is served at
      # the github.io URL rather than the production custom domain.
      - name: Remove CNAME from preview build
        if: github.event.action != 'closed'
        run: rm -f ./_site/CNAME

      # Deploys the built site to the gh-pages branch under pr-preview/pr-{number}/.
      # Posts a PR comment with the preview URL, updating it on each new commit.
      # Automatically removes the preview and comment when the PR is closed.
      - name: Deploy PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./_site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
